name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike:
    name: Spike APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the spike in release mode with the test key
        run: ./gradlew :spike:assembleRelease --stacktrace

      # Every library the release build pulls in, so each one's licence can be checked.
      - name: List the release dependencies
        run: |
          ./gradlew :spike:dependencies --configuration releaseRuntimeClasspath --console=plain > deps.txt
          grep -oE '[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[^ ]+( -> [^ ]+)?' deps.txt | sort -u

      - name: Report APK size
        run: ls -l spike/build/outputs/apk/release/

      - name: List native libraries in the APK
        run: unzip -l spike/build/outputs/apk/release/spike-release.apk | grep '\.so$' || echo "No native libraries."

      - name: Check 16 KB page alignment
        run: |
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 spike/build/outputs/apk/release/spike-release.apk | tail -3

      # zipalign checks where the libraries sit in the APK; this checks how they were linked.
      # Report only for the spike, which carries PDFium on purpose. The real app will enforce it.
      - name: Check native libraries are linked for 16 KB pages
        run: python3 .github/scripts/check_elf_alignment.py spike/build/outputs/apk/release/spike-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tsundoku-spike-apk
          path: spike/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke:
    name: Launch on emulator
    needs: spike
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tsundoku-spike-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Proves the app launches and the flow works. Emulator frame rates are not evidence.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-output
          path: |
            shots/
            smoke-logs/

      # Keeps the latest screenshots on a branch of their own, so they can be looked at in
      # the browser without downloading anything. The branch is replaced on every run.
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-screenshots

  publish:
    name: Publish the latest APK
    needs: [spike, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tsundoku-spike-apk
          path: apk

      # One pre-release that always holds the newest build, so there is a single page to
      # open on the phone. It is replaced on every push to main.
      - name: Replace the spike-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete spike-latest --yes --cleanup-tag || true
          gh release create spike-latest apk/spike-release.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Phase 0 spike (latest build)" \
            --notes "Built from ${GITHUB_SHA}. Release mode, signed with the repo test key. Download spike-release.apk on the phone and install it; it installs over earlier spike builds. Not for distribution."
