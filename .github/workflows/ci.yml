name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike:
    name: Spike APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the spike in release mode with the test key
        run: ./gradlew :spike:assembleRelease --stacktrace

      - name: List native libraries in the APK
        run: unzip -l spike/build/outputs/apk/release/spike-release.apk | grep '\.so$' || echo "No native libraries."

      - name: Check 16 KB page alignment
        run: |
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 spike/build/outputs/apk/release/spike-release.apk | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: tsundoku-spike-apk
          path: spike/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke:
    name: Launch on emulator
    needs: spike
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tsundoku-spike-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Proves the app launches and the flow works. Emulator frame rates are not evidence.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-output
          path: |
            shots/
            smoke-logs/

      # Keeps the latest screenshots on a branch of their own, so they can be looked at in
      # the browser without downloading anything. The branch is replaced on every run.
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-screenshots
