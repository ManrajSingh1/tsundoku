name: CI

# One run per change: pull requests are checked as pull requests, and main is checked
# (and published) when they merge. Documentation-only changes do not start a run.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --continue :core:model:test testDebugUnitTest --stacktrace

      - name: Unit test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "**/build/test-results/**/*.xml"

      # release is what is published. staging is the same minified build plus one screen
      # that lets the smoke test start an import without a file picker.
      - name: Build the release and staging APKs
        run: ./gradlew :app:assembleRelease :app:assembleStaging --stacktrace

      # Report only for now: prints what Android lint finds without failing the build.
      - name: Android lint
        run: |
          ./gradlew :app:lintRelease --continue || true
          for report in app/build/reports/lint-results-release.txt app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt; do
            if [ -f "$report" ]; then grep -E "Warning:|Error:|errors, [0-9]+ warnings" "$report" | sed "s#$PWD/##"; break; fi
          done

      # Report only for now: the style check runs as a standalone tool, so it cannot break
      # the build or slow Gradle down. It becomes a failing check once the report is clean.
      - name: Kotlin style (ktlint)
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/latest/download/ktlint || exit 0
          chmod +x ktlint
          ./ktlint --version || exit 0
          ./ktlint --relative "**/src/**/*.kt" "**/*.kts" "!**/build/**" > ktlint.txt 2>&1 || true
          echo "ktlint findings: $(grep -c ':[0-9]*:[0-9]*:' ktlint.txt || true)"
          sed -E 's/^.*\((standard:[a-z-]+)\)$/\1/' ktlint.txt | grep '^standard:' | sort | uniq -c | sort -rn | head -20
          head -60 ktlint.txt

      - name: Collect the APKs
        run: |
          mkdir apk
          cp app/build/outputs/apk/release/app-release.apk apk/
          cp app/build/outputs/apk/staging/app-staging.apk apk/
          ls -l apk

      # The app is local-first. If a library ever drags the network permission in, stop here.
      - name: Check the app cannot use the network
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions apk/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "The release APK asks for the INTERNET permission."
            exit 1
          fi

      - name: List native libraries in the APK
        run: unzip -l apk/app-release.apk | grep '\.so$' || echo "No native libraries."

      - name: Check 16 KB placement in the APK
        run: |
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 apk/app-release.apk | tail -3

      # zipalign checks where the libraries sit in the APK; this checks how they were linked.
      - name: Check native libraries are linked for 16 KB pages
        run: python3 .github/scripts/check_elf_alignment.py apk/app-release.apk --enforce

      # Every library the release build pulls in, so each one's licence can be checked.
      - name: List the release dependencies
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > deps.txt
          grep -oE '[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[^ ]+( -> [^ ]+)?' deps.txt | sort -u

      # The database schema Room exported, so it can be committed and migrations tested against it.
      - name: Print the exported database schema
        run: |
          for schema in $(find core/database/schemas -name '*.json' | sort); do
            echo "== $schema"
            cat "$schema"
            echo
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tsundoku-apks
          path: apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"

  device:
    name: Tests on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: tsundoku-apks
          path: apk

      # The build people already have installed, so the smoke test can upgrade from it.
      - name: Fetch the previously published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download preview-latest --repo "$GITHUB_REPOSITORY" --pattern tsundoku-preview.apk --dir apk-previous || echo "No previous preview."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The smoke test drives the minified app; then database and import tests run against
      # real SQLite and the real reading engines, and the library screen is driven through
      # its accessibility tree. Emulator speed is not evidence of anything.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The smoke test goes first, while the emulator is fresh; the Gradle build that
          # the instrumented tests need loads the machine enough to stall the launcher.
          script: |
            timeout 25m bash .github/scripts/smoke.sh
            ./gradlew :core:database:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest :feature:library:connectedDebugAndroidTest --stacktrace

      - name: Instrumented test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "**/build/outputs/androidTest-results/**/*.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-output
          path: |
            shots/
            smoke-logs/
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/

      # Keeps the latest screenshots on a branch of their own, so they can be looked at in
      # the browser without downloading anything. The branch is replaced on every run.
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event.pull_request.head.repo.fork != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Screenshots from the CI smoke test of ${GITHUB_REF_NAME} at ${GITHUB_SHA}." > README.md
          git add -A
          git commit -q -m "Smoke test screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-screenshots

  publish:
    name: Publish the latest APK
    needs: [build, device]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tsundoku-apks
          path: apk

      # One pre-release that always holds the newest build, so there is a single page to
      # open on the phone. It is replaced on every push to main.
      - name: Replace the preview-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-release.apk tsundoku-preview.apk
          gh release delete spike-latest --yes --cleanup-tag || true
          gh release delete preview-latest --yes --cleanup-tag || true
          gh release create preview-latest tsundoku-preview.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "TSUNDOKU preview (latest build)" \
            --notes "Built from ${GITHUB_SHA}. Minified release build, signed with the repository's test key. Download tsundoku-preview.apk on the phone and install it; it installs over earlier preview builds. Not for distribution."
